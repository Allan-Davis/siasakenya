<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyzer — Kenya Political Intelligence Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- NAV -->
  <nav class="navbar" id="navbar">
    <div class="nav-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">ANALYZER</span>
      <span class="brand-tag">KE</span>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="#" class="nav-link active" data-page="dashboard">Dashboard</a>
      <a href="#" class="nav-link" data-page="simulator">Simulator</a>
      <a href="#" class="nav-link" data-page="search">Data Search</a>
      <a href="#" class="nav-link" data-page="polls">Polls Center</a>
      <a href="#" class="nav-link" data-page="advisor">AI Advisor</a>
    </div>
  </nav>

  <!-- PAGES -->
  <main id="app">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-simulator" class="page"></div>
    <div id="page-search" class="page"></div>
    <div id="page-polls" class="page"></div>
    <div id="page-advisor" class="page"></div>
  </main>

  <!-- TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- LOADING OVERLAY -->
  <div id="loader" class="loader-overlay">
    <div class="loader-box">
      <div class="loader-ring"></div>
      <p>Loading Analyzer...</p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/search.js"></script>
  <script src="js/polls.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
